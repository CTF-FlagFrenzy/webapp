version: "3.8"

volumes:
  my-mysql-data:
  my-fast-data:

networks:
  my-network:

services:

  db:
    image: mysql:latest
    
    volumes:
      - my-mysql-data:/var/lib/mysql
      
    
    
    env_file: .env
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE_PORT: ${MYSQL_PORT}

    networks:
      - my-network

    

    ports:
    - "3306:3306"

  web:
    build:
      context: .
      dockerfile: DockerFile

   

    env_file: .env
    environment:
      ALLOWED_HOSTS: "*"

    working_dir: "/app"
    
    ports:
    - "8000:8000"
    
    command: >
      sh -c "sleep 10 && uvicorn main:app --host 0.0.0.0 --reload"

    networks:
    - my-network

